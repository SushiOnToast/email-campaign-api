{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Export Automation Dashboard</h1>

<div class="stats-row">
    <div class="stat-card">
        <div class="value">{{ total_buyers }}</div>
        <div class="label">Total Buyers Discovered</div>
    </div>
    <div class="stat-card">
        <div class="value">{{ sent_count }}</div>
        <div class="label">Emails Sent</div>
    </div>
    <div class="stat-card">
        <div class="value">{{ failed_count }}</div>
        <div class="label">Emails Failed</div>
    </div>
</div>

<div class="next-step">
    <a href="/upload" class="button-link">Get Started &rarr;</a>
</div>
{% endblock %}
