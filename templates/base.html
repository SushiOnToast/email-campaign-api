<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Export Automation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">Export Automation</div>
        <a href="/">Dashboard</a>
        <a href="/upload">Upload</a>
        <a href="/classify">Classify</a>
        <a href="/send">Send</a>
        <a href="/report">Report</a>
        <a href="/settings">Settings</a>
    </nav>
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}
                <div class="message">{{ m }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
